<html>
<!-- Part of https://github.com/jimmckeeth/lavalamp -->
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lava Lamp Simulator</title>
  <link rel="icon" type="image/png" href="volcano.png">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background-color: var(--bg);
    }

    #blob-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #toggle-controls {
      margin: 0;
      font-size: 30px;
      color: #006aff;
      cursor: pointer;
      width: fit-content;
    }

    #control-panel {
      position: absolute;
      top: 0;
      left: 0;
      padding: 30px;
      background: var(--controls-bg);
      border-radius: 20px;
    }

    #controls {
      display: var(--showControls);
      margin-top: 15px;
    }

    .source-row {
      padding-top: 10px;
      text-align: center;
    }

    .control-row {
      display: flex;
      align-items: center;
    }

    .control-row label {
      padding-left: 5px;
    }
  </style>
</head>

<body>
  <div id="control-panel">
    <p id='toggle-controls' onclick="toggleControls()">≡</p>
    <div id="controls">
      <div class="control-row">
        <input type="range" id="num-blobs" name="num-blobs" min="2" max="50" value="25">
        <label for="volume">Blobs</label>
      </div>
      <div class="control-row">
        <input type="range" id="min-blob-size" name="min-blob-size" min="5" max="100" value="50">
        <label for="min-blob-size">Min blob size</label>
      </div>
      <div class="control-row">
        <input type="range" id="max-blob-size" name="max-blob-size" min="5" max="100" value="80">
        <label for="max-blob-size">Max blob size</label>
      </div>
      <div class="control-row">
        <input type="range" id="blob-speed" name="blob-speed" min="1" max="10" value="2">
        <label for="blob-speed">Blob speed</label>
      </div>
      <div class="control-row">
        <input type="range" id="blob-stickiness" name="blob-stickiness" min="-1.0" max="1.5" value="1.0" step="0.05">
        <label for="blob-stickiness">Blob stickiness</label>
      </div>
      <div class="control-row">
        <input type="color" id="color1" name="color2" value="#ee0000">
        <label for="color1">Color 1</label>
      </div>
      <div class="control-row">
        <input type="color" id="color2" name="color2" value="#7700ee">
        <label for="color2">Color 2</label>
      </div>
      <div class="control-row">
        <input type="color" id="bg-color" name="bg-color" value="#000000" oninput="setBgColor(this.value)">
        <label for="bg-color">Background color</label>
      </div>
      <div class="source-row"><a href="https://github.com/jimmckeeth/lavalamp">Get the source</a></div>
    </div>
  </div>
  <canvas id="blob-canvas"></canvas>
  <script>
    var showControls = true;
    function updatedControls()
    {
      document.documentElement.style.setProperty('--showControls', showControls ? 'block' : 'none');
      document.documentElement.style.setProperty('--controls-bg', showControls ? '#ffffff77': '#00000000');
    }
    updatedControls();
    document.documentElement.style.setProperty('--bg', '#000000');

    function setBgColor(val) {
      document.documentElement.style.setProperty('--bg', val);
    }


    function toggleControls() {
      showControls = !showControls;
      updatedControls();
      document.getElementById('toggle-controls').innerHTML = showControls ? '≡' : '≡';
    }
  </script>
  <script src="blobs.js"></script>
</body>

</html>
